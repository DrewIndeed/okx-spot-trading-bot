[project]
name = "okxspot"
version = "0.1.0"
description = "Spot-only OKX trading engine. Paper by default. Not a claim of profitability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "matplotlib>=3.8",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
okxspot = "okxspot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okxspot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=okxspot --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["okxspot"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["okxspot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.pyplot", "websockets"]
ignore_missing_imports = true
